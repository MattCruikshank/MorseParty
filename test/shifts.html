<!doctype html><html><body style="margin:0;display:flex;gap:8px;background:#777;align-items:flex-start">
<!-- Plays every mode at phone width and records layout shifts (things moving) in both pages. -->
<iframe id="h" src="../index.html?pid=host1" style="width:390px;height:1400px;border:0"></iframe>
<iframe id="g" style="width:390px;height:1400px;border:0"></iframe>
<script>
window.log = [];
const L = s => log.push(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const until = async (fn, ms = 20000) => { const t = Date.now(); while (Date.now() - t < ms) { try { const v = fn(); if (v) return v; } catch (e) {} await sleep(100); } throw new Error('timeout'); };
const W = id => document.getElementById(id).contentWindow;
const D = id => W(id).document;
const MC = id => W(id).eval('MORSE_CHAR_TO_CODE');
async function key(id, code, unit = 100) {
  const k = D(id).getElementById('key');
  for (const c of code) {
    k.dispatchEvent(new (W(id).PointerEvent)('pointerdown', { bubbles: true, pointerId: 1 }));
    await sleep(c === '.' ? unit : 3 * unit);
    k.dispatchEvent(new (W(id).PointerEvent)('pointerup', { bubbles: true, pointerId: 1 }));
    await sleep(unit);
  }
  await sleep(400);
}
const press = (id, k, target) => (target || D(id)).dispatchEvent(new (W(id).KeyboardEvent)('keydown', { key: k, bubbles: true }));
const describe = n => !n ? '?' : n.nodeType === 3 ? 'text in ' + describe(n.parentElement) :
  n.tagName.toLowerCase() + (n.id ? '#' + n.id : '') + (n.className && typeof n.className === 'string' ? '.' + n.className.trim().split(/\s+/).join('.') : '');
let phase = 'setup';
const shifts = [];
function watch(id) {
  // Phones use overlay scrollbars; hide the desktop one so it can't shift the layout.
  const st = D(id).createElement('style'); st.textContent = 'html{scrollbar-width:none}'; D(id).head.appendChild(st);
  new (W(id).PerformanceObserver)(list => {
    for (const e of list.getEntries()) {
      if (phase === 'setup') continue;
      for (const s of e.sources || []) {
        const dy = Math.round(s.currentRect.y - s.previousRect.y), dh = Math.round(s.currentRect.height - s.previousRect.height);
        const dx = Math.round(s.currentRect.x - s.previousRect.x), dw = Math.round(s.currentRect.width - s.previousRect.width);
        shifts.push({ who: id, phase, node: describe(s.node), dx, dy, dw, dh, value: e.value });
      }
    }
  }).observe({ type: 'layout-shift', buffered: false });
}
window.run = async () => {
  try {
    await until(() => D('h').getElementById('wpmOut').textContent);
    D('h').getElementById('nameInput').value = 'Host';
    D('h').getElementById('createBtn').click();
    const code = await until(() => D('h').getElementById('roomCode').textContent);
    document.getElementById('g').src = '../index.html?pid=guest1&room=' + code;
    await until(() => D('g').getElementById('wpmOut') && D('g').getElementById('wpmOut').textContent);
    D('g').getElementById('nameInput').value = 'Guest';
    D('g').getElementById('joinBtn').click();
    await until(() => D('g').querySelectorAll('.player').length === 2 && D('h').querySelectorAll('.player').length === 2);
    watch('h'); watch('g');
    await sleep(800);

    phase = 'race-play';
    await key('h', '-.-.');
    await until(() => D('g').querySelector('.cell.open'));
    press('g', 'x'); await sleep(1200);
    press('g', 'c'); await until(() => D('h').querySelector('.cell.won'));
    await key('h', '..'); await sleep(6500); // nobody guesses: revealed as missed

    phase = 'team-switch';
    D('h').querySelector('.mode button[data-mode="team"]').click();
    await until(() => D('g').body.dataset.mode === 'team');
    const sel = D('h').getElementById('keyerRule'); sel.value = 'rr1'; sel.dispatchEvent(new Event('change'));
    await sleep(300);
    D('h').querySelector('#challengeSeg button[data-challenge="1"]').click();
    await until(() => !D('h').getElementById('targetPanel').hidden);
    await sleep(800);
    phase = 'team-play';
    let t = D('h').getElementById('targetCh').textContent;
    await key('h', MC('h')[t]);
    await until(() => D('g').querySelector('.cell.open'));
    press('g', t); await until(() => D('h').querySelector('.cell.done'));
    await until(() => D('g').getElementById('turnPanel').classList.contains('mine'));
    await sleep(500);
    t = D('g').getElementById('targetCh').textContent;
    const wrongT = t === 'E' ? 'T' : 'E';
    await key('g', MC('g')[wrongT]);   // key the wrong letter on purpose
    await until(() => D('h').querySelectorAll('.cell.open').length);
    press('h', 'Q'); await until(() => D('h').querySelectorAll('.cell.done').length >= 2);
    await sleep(800);

    phase = 'whack-switch';
    D('g').querySelector('.mode button[data-mode="whack"]').click();
    await until(() => D('h').getElementById('moleCh').classList.contains('up'));
    await sleep(800);
    phase = 'whack-play';
    const m = D('h').getElementById('moleCh').textContent;
    await key('h', MC('h')[m === 'E' ? 'T' : 'E']);  // a miss first
    await key('h', MC('h')[m]);
    await until(() => D('h').querySelector('.cell.hit'));
    await sleep(1800);

    phase = 'chat-switch';
    D('g').querySelector('.mode button[data-mode="chat"]').click();
    await until(() => D('h').body.dataset.mode === 'chat');
    await sleep(800);
    phase = 'chat-play';
    const ci = D('g').getElementById('chatInput'); ci.focus();
    for (const ch of 'hello there') { press('g', ch, ci); await sleep(60); }
    await key('h', '....');
    await sleep(1500);

    phase = 'done';
    // Summarize: biggest movers per phase.
    const groups = {};
    for (const s of shifts) {
      const k = `${s.phase} | ${s.who} | ${s.node}`;
      const g = groups[k] || (groups[k] = { n: 0, maxDy: 0, maxDh: 0, maxDx: 0, maxDw: 0, value: 0 });
      g.n++; g.value += s.value;
      g.maxDy = Math.max(g.maxDy, Math.abs(s.dy)); g.maxDh = Math.max(g.maxDh, Math.abs(s.dh));
      g.maxDx = Math.max(g.maxDx, Math.abs(s.dx)); g.maxDw = Math.max(g.maxDw, Math.abs(s.dw));
    }
    const rows = Object.entries(groups).filter(([k]) => !k.includes('-switch') && !k.includes('#toasts')).sort((a, b) => b[1].value - a[1].value);
    L(`total shift events: ${shifts.length}`);
    for (const [k, g] of rows.slice(0, 40)) L(`${k}  x${g.n}  dy<=${g.maxDy} dh<=${g.maxDh} dx<=${g.maxDx} dw<=${g.maxDw}`);
    window.done = 'ok';
  } catch (e) { L('ERROR ' + e.message + ' (phase ' + phase + ')'); window.done = 'fail'; }
};
</script></body></html>
